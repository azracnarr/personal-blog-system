server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: personal-blog
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:local-development-secret-change-me-to-at-least-32-characters}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  cookie-secure: ${COOKIE_SECURE:false}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD:admin123!}
  upload-dir: ${UPLOAD_DIR:uploads}
